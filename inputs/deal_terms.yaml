# BioMarin license economics, PRV, tax. Units $M.

biomarin:
  # [src] "high-single to low-double-digit tiered royalties" on net sales; bands/rates are [assumption]
  royalty_tiers:                       # marginal tiers on worldwide annual net sales
    - {up_to: 100, rate: 0.08}
    - {up_to: 250, rate: 0.10}
    - {up_to: null, rate: 0.12}
  royalty_tier_shift: {bear: 0.02, base: 0.0, bull: -0.01}
  regulatory_milestones:               # [src] up to $25.5M for first MPS IIIB product; timing [assumption]
    - {event: us_approval, amount: 25.5}
  sales_milestones:                    # [src] up to $100M per product; thresholds/split [assumption]
    - {threshold: 100, amount: 20}
    - {threshold: 250, amount: 30}
    - {threshold: 500, amount: 50}

prv:                                   # Rare Pediatric Disease PRV, awarded on approval
  value: {bear: 120, base: 160, bull: 200}   # recent sales ~$150-200M; Jazz $200M Jan 2026
  months_after_approval: 6

tax:
  rate: 0.23
  # Share count ~5x since Oct 2025 -> a Sec. 382 ownership change is likely. Pre-change NOLs are capped
  # per year; losses generated inside the model (post-change) are unrestricted. Verify with a 382 study.
  pre_change_nol: 100
  section_382_annual_limit: 5
  nol_taxable_income_cap: 0.80
